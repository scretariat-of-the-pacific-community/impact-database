# This docker-compose.yml file defines a multi-service environment for the Impact Database project.
#
# Services:
#   web:
#     - FastAPI application server.
#     - Built from ./app directory.
#     - Exposes port 8000.
#     - Depends on db, minio, and redis services.
#     - Mounts local ./app directory for live code updates.
#
#   db:
#     - PostgreSQL database with PostGIS extension.
#     - Uses official postgis/postgis image.
#     - Database credentials and name set via environment variables.
#     - Persists data in a named Docker volume.
#     - Exposes port 5432.
#
#   minio:
#     - MinIO object storage server.
#     - Accessible via ports 9000 (API) and 9001 (console).
#     - Credentials set via environment variables.
#     - Persists data in a named Docker volume.
#
#   redis:
#     - Redis in-memory data store.
#     - Exposes port 6379.
#
#   celery:
#     - Celery worker for background task processing.
#     - Uses same build context and code as web service.
#     - Depends on redis and db services.
#
#   flower:
#     - Celery monitoring web interface.
#     - Accessible via port 5555.
#     - Depends on redis service.
#
#   frontend:
#     - Next.js frontend application.
#     - Built from ./frontend directory.
#     - Exposes port 3000.
#     - Depends on web service.
#     - Includes development environment variables.
#     - Supports hot reloading via volume mounts.
#
# Volumes:
#   impact-database_postgres_data:
#     - Persists PostgreSQL data.
#   minio_data:
#     - Persists MinIO data.


services:
  postgis_db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: impact_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - impact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impact_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - impact-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - impact-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    command: server /data --console-address ":9001"

  web:
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgis_db:5432/impact_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=impact-images
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - MAX_FILE_SIZE=52428800
      - PYTHONPATH=/app
    depends_on:
      postgis_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  celery_worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgis_db:5432/impact_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=impact-images
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - PYTHONPATH=/app
    depends_on:
      postgis_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app
      - uploads_data:/app/uploads
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgis_db:5432/impact_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=impact-images
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - PYTHONPATH=/app
    depends_on:
      postgis_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app
      - uploads_data:/app/uploads
    restart: unless-stopped
    command: celery -A workers.celery_app beat --loglevel=info

  flower:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app
    restart: unless-stopped
    command: celery -A workers.celery_app flower --port=5555

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_VERSION=v1
      - NEXT_PUBLIC_ENABLE_GUEST_ACCESS=true
      - NEXT_PUBLIC_ENABLE_MAP_VIEW=true
      - NEXT_PUBLIC_ENABLE_ANALYTICS=true
      - NEXT_PUBLIC_ENABLE_EXPORT=true
      - NEXT_PUBLIC_DEFAULT_MAP_CENTER="-170.8, -14.3"
      - NEXT_PUBLIC_DEFAULT_MAP_ZOOM=4
      - NEXT_PUBLIC_APP_NAME="SPC Ocean Portal"
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_SUPPORT_EMAIL=ocean-portal@spc.int
      - NEXT_PUBLIC_CACHE_TTL=300
      - NEXT_PUBLIC_IMAGE_PROXY_URL=http://localhost:8000/api/v1/images/proxy
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      web:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:

networks:
  impact-network:
    driver: bridge
