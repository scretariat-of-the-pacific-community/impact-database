version: '3.8'

# This docker-compose.yml file defines a multi-service environment for the Impact Database project.
#
# Services:
#   web:
#     - FastAPI application server.
#     - Built from ./app directory.
#     - Exposes port 8000.
#     - Depends on db, minio, and redis services.
#     - Mounts local ./app directory for live code updates.
#
#   db:
#     - PostgreSQL database with PostGIS extension.
#     - Uses official postgis/postgis image.
#     - Database credentials and name set via environment variables.
#     - Persists data in a named Docker volume.
#     - Exposes port 5432.
#
#   minio:
#     - MinIO object storage server.
#     - Accessible via ports 9000 (API) and 9001 (console).
#     - Credentials set via environment variables.
#     - Persists data in a named Docker volume.
#
#   redis:
#     - Redis in-memory data store.
#     - Exposes port 6379.
#
#   celery:
#     - Celery worker for background task processing.
#     - Uses same build context and code as web service.
#     - Depends on redis and db services.
#
#   frontend:
#     - Next.js frontend application.
#     - Built from ./frontend directory.
#     - Exposes port 3000.
#     - Depends on web service.
#
# Volumes:
#   impact-database_postgres_data:
#     - Persists PostgreSQL data.
#   minio_data:
#     - Persists MinIO data.


services:
  postgis_db:
    image: postgis/postgis:14-3.2
    environment:
      POSTGRES_DB: impact_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - impact-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - impact-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - impact-network
    command: server /data --console-address ":9001"

  web:
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgis_db:5432/impact_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=impact-images
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
      - MAX_FILE_SIZE=52428800
    depends_on:
      - postgis_db
      - redis
      - minio
    networks:
      - impact-network
    volumes:
      - ./app:/app
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgis_db:5432/impact_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=impact-images
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - postgis_db
      - redis
      - minio
    networks:
      - impact-network
    volumes:
      - ./app:/app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgis_db:5432/impact_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=impact-images
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - postgis_db
      - redis
      - minio
    networks:
      - impact-network
    volumes:
      - ./app:/app
    command: celery -A workers.celery_app beat --loglevel=info

  flower:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - redis
    networks:
      - impact-network
    volumes:
      - ./app:/app
    command: celery -A workers.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  impact-network:
    driver: bridge
