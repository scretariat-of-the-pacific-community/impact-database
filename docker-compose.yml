# This docker-compose.yml file defines a multi-service environment for the Impact Database project.
#
# Services:
#   web:
#     - FastAPI application server.
#     - Built from ./app directory.
#     - Exposes port 8000.
#     - Depends on db, minio, and redis services.
#     - Mounts local ./app directory for live code updates.
#
#   db:
#     - PostgreSQL database with PostGIS extension.
#     - Uses official postgis/postgis image.
#     - Database credentials and name set via environment variables.
#     - Persists data in a named Docker volume.
#     - Exposes port 5432.
#
#   minio:
#     - MinIO object storage server.
#     - Accessible via ports 9000 (API) and 9001 (console).
#     - Credentials set via environment variables.
#     - Persists data in a named Docker volume.
#
#   redis:
#     - Redis in-memory data store.
#     - Exposes port 6379.
#
#   celery_worker:
#     - Celery worker service for background task processing.
#     - Uses same build context and code as web service.
#     - Depends on redis and db services.
#
#   celery_beat:
#     - Celery beat service for scheduling periodic tasks.
#     - Uses same build context and code as web service.
#     - Depends on redis and db services.
#
#   flower:
#     - Celery monitoring web interface.
#     - Accessible via port 5555.
#     - Depends on redis service.
#     - Depends on api service.
#   frontend:
#     - Next.js frontend application.
#     - Built from ./frontend directory.
#     - Exposes port 3000.
#     - Depends on web service.
#     - Includes development environment variables.
#     - Supports hot reloading via volume mounts.
#
# Volumes:
#   impact-database_postgres_data:
#     - Persists PostgreSQL data.
#   minio_data:
#     - Persists MinIO data.


services:
  postgis_db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - impact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impact_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - impact-network
    sysctls:
      - net.core.somaxconn=511
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    ports:
      - "9020:9000"
      - "9021:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - impact-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    command: server /data --console-address ":9001"

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=api
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=${MINIO_SECURE}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - PYTHONPATH=${PYTHONPATH}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3103}
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    depends_on:
      postgis_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app:delegated
      - uploads_data:/app/uploads:rw
    tmpfs:
      - /tmp:size=2G,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  celery_worker:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=worker
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=${MINIO_SECURE}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - PYTHONPATH=${PYTHONPATH}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3103}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    depends_on:
      postgis_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app:delegated
      - uploads_data:/app/uploads:rw
    tmpfs:
      - /tmp:size=1G,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]

  celery_beat:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=beat
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=${MINIO_SECURE}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - PYTHONPATH=${PYTHONPATH}
    depends_on:
      postgis_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app:delegated
      - uploads_data:/app/uploads:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]

  flower:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: development
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=flower
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - PYTHONPATH=${PYTHONPATH}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - impact-network
    volumes:
      - ./app:/app:delegated
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3103:3000"
    environment:
      - NODE_ENV=development
      # Enable basePath for subdirectory deployment behind reverse proxy
      - NEXT_PUBLIC_BASE_PATH=/impact-database
      - NEXT_PUBLIC_API_URL=https://opmthredds.gem.spc.int
      - NEXT_PUBLIC_API_URL_INTERNAL=http://api:8000
      - NEXT_PUBLIC_API_VERSION=v1
      - NEXT_PUBLIC_ENABLE_GUEST_ACCESS=true
      - NEXT_PUBLIC_ENABLE_MAP_VIEW=true
      - NEXT_PUBLIC_ENABLE_ANALYTICS=true
      - NEXT_PUBLIC_ENABLE_EXPORT=true
      - NEXT_PUBLIC_DEFAULT_MAP_CENTER="-170.8, -14.3"
      - NEXT_PUBLIC_DEFAULT_MAP_ZOOM=4
      - NEXT_PUBLIC_APP_NAME="SPC Ocean Portal"
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_SUPPORT_EMAIL=ocean-portal@spc.int
      - NEXT_PUBLIC_CACHE_TTL=300
      - NEXT_PUBLIC_SPC_SSO_ISSUER=https://sso.spc.int
      - NEXT_PUBLIC_SPC_SSO_CLIENT_ID=ocean-portal
      - NEXT_PUBLIC_IMAGE_PROXY_URL=https://opmthredds.gem.spc.int/api/v1/images/proxy
      - NEXT_TELEMETRY_DISABLED=1
      # Disable Next.js DevTools to avoid geist font 404 errors
      - NEXT_DEVTOOLS_DISABLED=1
    depends_on:
      api:
        condition: service_started  # Changed from service_healthy to service_started
    networks:
      - impact-network
    volumes:
      - ./frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
  frontend_node_modules:

networks:
  impact-network:
    driver: bridge
