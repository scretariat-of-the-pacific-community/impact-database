# Development-specific overrides for docker-compose.yml
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Development-specific environment variables
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_VERSION=v1
      - NEXT_PUBLIC_ENABLE_GUEST_ACCESS=true
      - NEXT_PUBLIC_ENABLE_MAP_VIEW=true
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false  # Disabled in development
      - NEXT_PUBLIC_ENABLE_EXPORT=true
      - NEXT_PUBLIC_DEFAULT_MAP_CENTER="-170.8, -14.3"
      - NEXT_PUBLIC_DEFAULT_MAP_ZOOM=4
      - NEXT_PUBLIC_APP_NAME="SPC Ocean Portal (Dev)"
      - NEXT_PUBLIC_APP_VERSION=1.0.0-dev
      - NEXT_PUBLIC_SUPPORT_EMAIL=ocean-portal@spc.int
      - NEXT_PUBLIC_CACHE_TTL=60  # Shorter cache for development
      - NEXT_PUBLIC_IMAGE_PROXY_URL=http://localhost:8000/api/v1/images/proxy
      - FAST_REFRESH=true
    volumes:
      # Mount source code for hot reloading
      - ./frontend:/app
      # Preserve node_modules as a named volume
      - frontend_node_modules:/app/node_modules
      # Preserve .next build cache
      - frontend_next_cache:/app/.next
    command: npm run dev:host
    
  web:
    environment:
      # Development-specific backend settings
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RELOAD=true
      
volumes:
  frontend_node_modules:
  frontend_next_cache:
