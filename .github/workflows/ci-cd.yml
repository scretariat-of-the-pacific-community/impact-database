name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'upgrade/**']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Frontend Tests
  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present
        continue-on-error: true
      
      - name: Run Jest Tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
      
      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Frontend Performance & Accessibility Assessment
  frontend-assess:
    name: Frontend Quality Assessment
    runs-on: ubuntu-latest
    needs: [frontend-test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      
      - name: Start application
        working-directory: ./frontend
        run: npm start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      
      - name: Wait for application startup
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3100 > /dev/null; then
              echo "✓ Application is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Application failed to start"
              exit 1
            fi
            sleep 1
          done
      
      - name: Run Lighthouse Audit
        working-directory: ./frontend
        run: npm run lighthouse:ci
        continue-on-error: true
      
      - name: Run Pa11y Accessibility Audit
        working-directory: ./frontend
        run: npm run audit:pa11y
        continue-on-error: true
      
      - name: Run Axe Accessibility Tests
        working-directory: ./frontend
        run: npm run audit:axe
        continue-on-error: true
      
      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-reports
          path: ./frontend/lighthouse-reports/
          retention-days: 30
        if: always()
      
      - name: Upload Pa11y Report
        uses: actions/upload-artifact@v3
        with:
          name: pa11y-report
          path: ./frontend/pa11y-audit-report.json
          retention-days: 30
        if: always()
      
      - name: Comment PR with Assessment Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🏆 Frontend Quality Assessment\n\n';
            comment += '### Performance Audit (Lighthouse)\n';
            comment += '- Status: ✅ Completed\n';
            comment += '- Target: Performance 85%+, Accessibility 95%+, Best Practices 90%+, SEO 90%+\n';
            comment += '- Reports available in artifacts\n\n';
            
            comment += '### Accessibility Audit (Pa11y + Axe)\n';
            comment += '- Status: ✅ Completed\n';
            comment += '- Standard: WCAG 2.1 AA\n';
            comment += '- Report available in artifacts\n\n';
            
            comment += '### Web Vitals Monitoring\n';
            comment += '- Lighthouse CLS: ≤ 0.1\n';
            comment += '- Lighthouse FID: ≤ 100ms\n';
            comment += '- Lighthouse FCP: ≤ 1800ms\n';
            comment += '- Lighthouse LCP: ≤ 2400ms\n';
            comment += '- Lighthouse TTFB: ≤ 600ms\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })
        continue-on-error: true

  # Backend Tests
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: impact_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run pytest
        working-directory: ./app
        run: |
          pytest tests/ -v --cov=core --cov-report=xml \
            --cov-report=html --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/impact_db_test
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: minio.example.com:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./app/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Docker Build
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependency Check
  dependency-check:
    name: Security Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Code Quality
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Status Check
  status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.frontend-test.result }}" = "failure" ] || [ "${{ needs.backend-test.result }}" = "failure" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ All checks passed"
