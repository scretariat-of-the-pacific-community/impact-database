<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009EE0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#18B374;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Animated wave circles -->
  <g id="waves">
    <circle cx="100" cy="100" r="60" stroke="url(#waveGrad)" stroke-width="3" fill="none" opacity="0.8">
      <animate attributeName="r" values="60;80;60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="45" stroke="url(#waveGrad)" stroke-width="3" fill="none" opacity="0.6">
      <animate attributeName="r" values="45;65;45" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="30" stroke="url(#waveGrad)" stroke-width="3" fill="none" opacity="0.4">
      <animate attributeName="r" values="30;50;30" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center icon - Compass/Wave symbol -->
  <g transform="translate(100, 100)">
    <!-- Wave pattern -->
    <path d="M -20 0 Q -10 -8, 0 0 Q 10 8, 20 0" stroke="#009EE0" stroke-width="2.5" fill="none" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M -15 8 Q -7 0, 0 8 Q 7 16, 15 8" stroke="#18B374" stroke-width="2.5" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,2; 0,0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- Compass needle -->
    <path d="M 0 -15 L 3 0 L 0 15 L -3 0 Z" fill="#FF6B4A" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
