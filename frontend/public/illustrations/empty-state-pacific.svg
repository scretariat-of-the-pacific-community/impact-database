<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#009EE0;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#009EE0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0369A1;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>
  
  <!-- Ocean waves -->
  <path d="M0 180 Q 50 170, 100 180 T 200 180 T 300 180 T 400 180 L 400 300 L 0 300 Z" fill="url(#oceanGradient)" opacity="0.4"/>
  <path d="M0 200 Q 60 190, 120 200 T 240 200 T 360 200 T 400 200 L 400 300 L 0 300 Z" fill="url(#oceanGradient)" opacity="0.6"/>
  <path d="M0 220 Q 70 210, 140 220 T 280 220 T 400 220 L 400 300 L 0 300 Z" fill="url(#oceanGradient)" opacity="0.8"/>
  
  <!-- Island silhouette -->
  <ellipse cx="200" cy="160" rx="80" ry="30" fill="#18B374" opacity="0.6"/>
  <path d="M 160 160 Q 180 130, 200 140 Q 220 130, 240 160" fill="#18B374" opacity="0.8"/>
  
  <!-- Palm trees -->
  <g transform="translate(180, 140)">
    <rect x="-2" y="0" width="4" height="25" fill="#8B4513" opacity="0.8"/>
    <path d="M 0 0 Q -15 -10, -20 -5 Q -15 -8, 0 0" fill="#18B374" opacity="0.9"/>
    <path d="M 0 0 Q 15 -10, 20 -5 Q 15 -8, 0 0" fill="#18B374" opacity="0.9"/>
    <path d="M 0 0 Q -5 -15, -3 -20 Q -5 -15, 0 0" fill="#18B374" opacity="0.9"/>
  </g>
  
  <g transform="translate(220, 145)">
    <rect x="-2" y="0" width="4" height="20" fill="#8B4513" opacity="0.7"/>
    <path d="M 0 0 Q -12 -8, -15 -3 Q -12 -6, 0 0" fill="#18B374" opacity="0.8"/>
    <path d="M 0 0 Q 12 -8, 15 -3 Q 12 -6, 0 0" fill="#18B374" opacity="0.8"/>
  </g>
  
  <!-- Sun -->
  <circle cx="320" cy="60" r="30" fill="#FF6B4A" opacity="0.3"/>
  <circle cx="320" cy="60" r="25" fill="#FF6B4A" opacity="0.5"/>
  <circle cx="320" cy="60" r="20" fill="#FF6B4A" opacity="0.8"/>
  
  <!-- Empty state text area -->
  <rect x="80" y="240" width="240" height="40" rx="8" fill="#0F172A" opacity="0.7"/>
  
  <!-- Decorative waves at bottom -->
  <path d="M 0 290 Q 10 285, 20 290 T 40 290 T 60 290 T 80 290 T 100 290 T 120 290 T 140 290 T 160 290 T 180 290 T 200 290 T 220 290 T 240 290 T 260 290 T 280 290 T 300 290 T 320 290 T 340 290 T 360 290 T 380 290 T 400 290" 
        stroke="#009EE0" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
