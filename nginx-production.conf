# Nginx configuration for production deployment
# This file should be placed in /etc/nginx/sites-available/ and symlinked to sites-enabled

upstream backend_api {
    server api:8000;
    # Or use localhost:8000 if running on same server
    # server localhost:8000;
}

upstream frontend_app {
    server frontend:3000;
    # Or use localhost:3100 if running on same server
    # server localhost:3100;
}

server {
    listen 80;
    listen [::]:80;
    server_name opmthredds.gem.spc.int;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size (500MB for videos)
    client_max_body_size 500M;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # API endpoints - proxy to backend
    location ~ ^/api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
        
        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Upload endpoints - proxy to backend
    location ~ ^/upload/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable caching for uploaded images/videos
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Frontend image detail pages - route to Next.js
    # These are frontend routes, not API endpoints
    location ~ ^/images/[a-f0-9-]+ {
        # Rewrite to Next.js with basePath
        rewrite ^/images/(.*)$ /impact-database/images/$1 break;
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for HMR in development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend application (Next.js with basePath)
    location /impact-database/ {
        proxy_pass http://frontend_app/impact-database/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for HMR in development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js static files
    location /_next/static/ {
        proxy_pass http://frontend_app/_next/static/;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # Root redirect to application
    location = / {
        return 301 /impact-database/;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

