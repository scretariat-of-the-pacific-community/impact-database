# Production configuration for docker-compose.yml
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  postgis_db:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      # Production environment variables
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_VERSION=v1
      - NEXT_PUBLIC_ENABLE_GUEST_ACCESS=true
      - NEXT_PUBLIC_ENABLE_MAP_VIEW=true
      - NEXT_PUBLIC_ENABLE_ANALYTICS=true
      - NEXT_PUBLIC_ENABLE_EXPORT=true
      - NEXT_PUBLIC_DEFAULT_MAP_CENTER="-170.8, -14.3"
      - NEXT_PUBLIC_DEFAULT_MAP_ZOOM=4
      - NEXT_PUBLIC_APP_NAME="SPC Ocean Portal"
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_SUPPORT_EMAIL=ocean-portal@spc.int
      - NEXT_PUBLIC_CACHE_TTL=300
      - NEXT_PUBLIC_IMAGE_PROXY_URL=http://localhost:8000/api/v1/images/proxy
    # Remove volume mounts for production
    volumes: []
    restart: unless-stopped
    
  web:
    environment:
      # Production backend settings
      - DEBUG=false
      - LOG_LEVEL=INFO
      - RELOAD=false
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - MINIO_ACCESS_KEY_FILE=/run/secrets/minio_access_key
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_secret_key
    secrets:
      - secret_key
      - minio_access_key
      - minio_secret_key

  celery_worker:
    environment:
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - MINIO_ACCESS_KEY_FILE=/run/secrets/minio_access_key
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_secret_key
    secrets:
      - secret_key
      - minio_access_key
      - minio_secret_key

  celery_beat:
    environment:
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - MINIO_ACCESS_KEY_FILE=/run/secrets/minio_access_key
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_secret_key
    secrets:
      - secret_key
      - minio_access_key
      - minio_secret_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  secret_key:
    file: ./secrets/secret_key
  minio_access_key:
    file: ./secrets/minio_access_key
  minio_secret_key:
    file: ./secrets/minio_secret_key
