# Compose overrides for production mode.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d
# Generated: January 4, 2026
#
# NOTE: This file adds production settings without changing ports from base compose.
# Ports from docker-compose.yml: API=8000, Frontend=3103, PostgreSQL=5436, Redis=6380, MinIO=9020/9021

services:
  postgis_db:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M

  minio:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  api:
    build:
      target: runner
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: "${SECRET_KEY}"
      DATABASE_URL: "${DATABASE_URL}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-impact-images}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      SESSION_SECURE: "true"
      SESSION_SAMESITE: "strict"
      SESSION_HTTPONLY: "true"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - uploads_data:/app/uploads:rw
    tmpfs:
      - /tmp:size=2G,mode=1777

  celery_worker:
    build:
      target: runner
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - uploads_data:/app/uploads:rw
    tmpfs:
      - /tmp:size=1G,mode=1777

  celery_beat:
    build:
      target: runner
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads:rw

  flower:
    build:
      target: runner
      args:
        - BUILDKIT_INLINE_CACHE=1
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      target: runner
      args:
        - BUILDKIT_INLINE_CACHE=1
        - NEXT_PUBLIC_BASE_PATH=/impact-database
        - NEXT_PUBLIC_API_URL=https://opmthredds.gem.spc.int
        - NEXT_PUBLIC_API_URL_INTERNAL=http://api:8000
        - NEXT_PUBLIC_APP_NAME=SPC Ocean Portal
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: "/impact-database"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_API_URL_INTERNAL: "${NEXT_PUBLIC_API_URL_INTERNAL}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
