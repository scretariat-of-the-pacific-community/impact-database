server {
  listen      443 ssl;
  client_max_body_size 100M;
  
  #server_name 192.168.4.92;
  server_name opmthredds.gem.spc.int;
  ssl_certificate /etc/letsencrypt/live/opmthredds.gem.spc.int/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opmthredds.gem.spc.int/privkey.pem;
  ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;

  # Redirect root and common paths to /impact-database/
  location = / {
    return 301 /impact-database/;
  }
  
  location = /profile {
    return 301 /impact-database/profile;
  }
  
  location = /auth/login {
    return 301 /impact-database/auth/login;
  }

# JupyterHub configuration
    location /jupyterhub/ {
        proxy_pass http://localhost:8000/;  # Note the trailing slash!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }


  # Apache
  location /ncWMS {
    proxy_pass http://localhost:8082;
  }
  
  location /anuj {
    proxy_pass http://localhost:8085;
  }
  location /plotter {
    proxy_pass http://localhost:8086;
  }
  location /thredds {
    proxy_pass http://localhost:8081;
  }
  location /data_download {
    proxy_pass http://localhost:8085;
  }

  location /eciks {
    proxy_pass http://localhost:80;
  }

  location /monitoring {
    proxy_pass http://localhost:3111;
  }

  location /service {
    proxy_pass http://localhost:8011;
  }

  # Partner2 Next.js app
  location = /partner2 {
    return 301 /partner2/;
  }

  location /partner2/ {
    rewrite ^/partner2/(.*) /$1 break;
    proxy_pass http://localhost:3112;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js static assets for partner2
  location /_next/ {
    proxy_pass http://localhost:3112;
    proxy_set_header Host $host;
  }

  # ============================================
  # Impact Database Application
  # ============================================
  
  # Redirect to ensure trailing slash
  location = /impact-database {
    return 301 /impact-database/;
  }

  # Main frontend - Next.js with basePath=/impact-database
  # Pass the full path to Next.js which expects requests at /impact-database/*
  location /impact-database/ {
    proxy_pass http://localhost:3100;
    proxy_http_version 1.1;
    
    # WebSocket support for HMR (Hot Module Reload)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # Don't cache for development HMR to work
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts for slow development builds
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Impact Database API - strip prefix and forward to backend
  location /impact-database-api/ {
    rewrite ^/impact-database-api/(.*) /$1 break;
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100M;
    proxy_read_timeout 300s;
  }

  # ============================================
  # Direct API routes (backwards compatibility)
  # ============================================
  
  location /erddap {
    proxy_pass http://localhost:8084;
  }

  # Health check endpoint
  location = /health {
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Upload images route
  location /upload/ {
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100M;
    proxy_read_timeout 300;
  }

  # Main API routes
  location /api/ {
    proxy_pass http://localhost:8000;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 100M;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }

  # to add https to the Godiva url
  if ($args ~* "(.*)http://(.*)"){
    set $args "$1https://$2";
    rewrite ^/thredds/Godiva.html(.*)$ /thredds/Godiva.html redirect;
  } 
}
