# Impact Database - Nginx Reverse Proxy Configuration
# This configuration should be included in your main nginx config or placed in /etc/nginx/conf.d/
#
# The key difference: Next.js with basePath expects the proxy to KEEP the /impact-database prefix
# because basePath tells Next.js to expect requests at /impact-database/* paths
#
# For the existing setup where basePath is configured in Next.js:
# - Requests come in at /impact-database/*
# - Proxy forwards to localhost:3100/impact-database/* (keeping the prefix)
# - Next.js handles the basePath internally

# Impact Database Frontend (Next.js)
# Redirect to ensure trailing slash
location = /impact-database {
    return 301 /impact-database/;
}

# Main frontend location - DO NOT strip the prefix when using Next.js basePath
location /impact-database/ {
    proxy_pass http://localhost:3100/impact-database/;
    proxy_http_version 1.1;
    
    # WebSocket support for HMR (Hot Module Reload)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # Don't cache for development
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    
    # Timeouts for slow development builds
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Next.js static assets (/_next/) - these need the basePath prefix too
location /impact-database/_next/ {
    proxy_pass http://localhost:3100/impact-database/_next/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support for HMR
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Impact Database API - strip the prefix and proxy to backend
location /impact-database-api/ {
    rewrite ^/impact-database-api/(.*) /$1 break;
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # For file uploads
    client_max_body_size 100M;
    proxy_read_timeout 300s;
}

# Direct API access (for backwards compatibility)
location /api/ {
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 100M;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# Upload routes
location /upload/ {
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    client_max_body_size 100M;
    proxy_read_timeout 300s;
}

# Health check
location = /health {
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
