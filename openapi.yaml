openapi: 3.1.0
info:
  title: Impact Database API
  version: 1.0.0
  description: API for uploading and querying hazard-related images and metadata.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
  /vocabularies:
    get:
      summary: Get supported vocabularies
      responses:
        '200':
          description: Controlled vocabularies for metadata fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  hazard_types:
                    type: array
                    items:
                      type: string
                  status_values:
                    type: array
                    items:
                      type: string
                  maintenance_frequency:
                    type: array
                    items:
                      type: string
                  capture_methods:
                    type: array
                    items:
                      type: string
                  access_constraints:
                    type: array
                    items:
                      type: string
                  security_classifications:
                    type: array
                    items:
                      type: string
                  language_codes:
                    type: array
                    items:
                      type: string
                  iso_enabled:
                    type: boolean
  /api/token:
    post:
      summary: Obtain access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
  /upload:
    post:
      summary: Upload an image with metadata
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - hazard_type
                - location
              properties:
                file:
                  type: string
                  format: binary
                hazard_type:
                  type: string
                location:
                  type: string
                country:
                  type: string
                manual_latitude:
                  type: number
                manual_longitude:
                  type: number
                title:
                  type: string
                title_i18n:
                  type: object
                  additionalProperties:
                    type: string
                abstract:
                  type: string
                abstract_i18n:
                  type: object
                  additionalProperties:
                    type: string
                purpose:
                  type: string
                purpose_i18n:
                  type: object
                  additionalProperties:
                    type: string
                keywords:
                  type: array
                  items:
                    type: string
                keywords_i18n:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                metadata_language:
                  type: string
      responses:
        '200':
          description: Upload success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadata'
        '400':
          description: Validation error
  /hazards:
    get:
      summary: Query hazards
      parameters:
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: country
          schema:
            type: string
      responses:
        '200':
          description: List of hazards
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  hazards:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageMetadata'
  /images:
    get:
      summary: List images
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: hazard_type
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: has_coordinates
          schema:
            type: boolean
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageMetadata'
  /geojson:
    get:
      summary: Get geospatial data in GeoJSON format
      responses:
        '200':
          description: GeoJSON FeatureCollection of images with coordinates
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
  /images/{filename}:
    get:
      summary: Get single image metadata
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadata'
        '404':
          description: Image not found
  /statistics:
    get:
      summary: Get database statistics
      responses:
        '200':
          description: Overview of stored images
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_images:
                    type: integer
                  images_with_coordinates:
                    type: integer
                  coordinate_coverage:
                    type: string
                  hazard_type_distribution:
                    type: object
                    additionalProperties:
                      type: integer
                  iso_compliance:
                    type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ImageMetadata:
      type: object
      properties:
        filename:
          type: string
        hazard_type:
          type: string
        location:
          type: string
        country:
          type: string
        timestamp:
          type: string
          format: date-time
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        title:
          type: string
          nullable: true
        title_i18n:
          type: object
          additionalProperties:
            type: string
        abstract:
          type: string
          nullable: true
        abstract_i18n:
          type: object
          additionalProperties:
            type: string
        purpose:
          type: string
          nullable: true
        purpose_i18n:
          type: object
          additionalProperties:
            type: string
        keywords:
          type: array
          items:
            type: string
        keywords_i18n:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        metadata_language:
          type: string
      required:
        - filename
        - hazard_type
        - location
        - timestamp
        - metadata_language
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
      required:
        - access_token
        - token_type
